<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Google Analytics (GA4) — TODO: replace G-XXXXXXXXXX with the real
         Measurement ID (same placeholder used across marketing/*.html — a
         repo-wide find/replace of G-XXXXXXXXXX covers every page at once).
         This only fires the initial-load pageview; React Navigation's
         client-side route changes don't trigger new gtag('event', 'page_view')
         calls on their own — wire those up separately if per-screen
         tracking inside the app ever matters. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <title>%WEB_TITLE%</title>
    <!-- PWA / "Add to Home Screen" support (docs/handoff/14-reset-icon-rewards-undefeated.md,
         section 2). Paths are relative (no leading slash) so they resolve the
         same regardless of app.json's experiments.baseUrl. -->
    <link rel="manifest" href="manifest.json" />
    <!-- iOS Safari doesn't read the manifest for its home-screen icon — needs its own tag. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
